[package]
name = "sentinellite"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A local-first Windows event monitoring MVP"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "query"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
quick-xml = "0.38"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_EventLog"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
